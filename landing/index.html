<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Radar</title>
  <meta name="description" content="BTC Radar · Radar de mercado Bitcoin: on-chain, sinais, medo e ganância e alertas em tempo real." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BTC Radar" />
  <meta property="og:description" content="Radar de mercado Bitcoin: on-chain, sinais e sentimento em tempo real." />
  <meta property="og:image" content="https://btc-radar.pages.dev/assets/cover.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/landing.css" />
</head>
<body>
  <!-- Cena: arte de fundo por breakpoint + overlay SVG (CSS/SVG only, sem JS de animacao) -->
  <div class="scene" aria-hidden="true">
    <picture class="cena">
      <source media="(max-width: 767px)" srcset="/assets/bg-mobile.webp" />
      <img class="cena__img" src="/assets/bg-desktop.webp" alt="" width="1672" height="941" decoding="async" fetchpriority="high" />
    </picture>

    <svg class="overlay overlay--desktop" width="1672" height="941" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="coreGradD" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8b33a" stop-opacity="0.55" />
          <stop offset="55%" stop-color="#e8b33a" stop-opacity="0.14" />
          <stop offset="100%" stop-color="#e8b33a" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glowGradD" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f7d98c" stop-opacity="0.32" />
          <stop offset="45%" stop-color="#e8b33a" stop-opacity="0.10" />
          <stop offset="100%" stop-color="#e8b33a" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle class="brilho" cx="1245" cy="350" r="300" fill="url(#glowGradD)" />
      <circle class="nucleo" cx="1245" cy="350" r="95" fill="url(#coreGradD)" />
      <path class="linha l1" d="M1245 350 C 1100 300, 900 220, 700 180" />
      <path class="linha l2" d="M1245 350 C 1310 430, 1420 520, 1560 620" />
      <path class="linha l3" d="M1245 350 C 1150 480, 1000 600, 860 700" />
      <path class="linha l4" d="M1245 350 C 1360 250, 1490 195, 1600 140" />
      <path class="linha l5" d="M1245 350 C 1200 200, 1120 120, 1010 70" />
      <circle class="no no--1" cx="700" cy="180" r="5" />
      <circle class="no no--2" cx="1560" cy="620" r="6" />
      <circle class="no no--3" cx="860" cy="700" r="5" />
      <circle class="no no--4" cx="1600" cy="140" r="4" />
      <circle class="no no--5" cx="1010" cy="70" r="4" />
      <circle class="no no--6" cx="1380" cy="470" r="3" />
      <circle class="no no--7" cx="1090" cy="250" r="3" />
      <circle class="particula p--1" cx="420" cy="120" r="1.6" />
      <circle class="particula p--2" cx="520" cy="720" r="1.4" />
      <circle class="particula p--3" cx="300" cy="420" r="1.2" />
      <circle class="particula p--4" cx="900" cy="860" r="1.5" />
      <circle class="particula p--5" cx="1490" cy="820" r="1.3" />
      <circle class="particula p--6" cx="1640" cy="320" r="1.4" />
      <circle class="particula p--7" cx="250" cy="200" r="1.1" />
      <circle class="particula p--8" cx="640" cy="90" r="1.3" />
    </svg>

    <svg class="overlay overlay--mobile" width="941" height="1672" viewBox="0 0 941 1672" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="coreGradM" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8b33a" stop-opacity="0.55" />
          <stop offset="55%" stop-color="#e8b33a" stop-opacity="0.14" />
          <stop offset="100%" stop-color="#e8b33a" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glowGradM" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f7d98c" stop-opacity="0.30" />
          <stop offset="45%" stop-color="#e8b33a" stop-opacity="0.10" />
          <stop offset="100%" stop-color="#e8b33a" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle class="brilho" cx="645" cy="1145" r="280" fill="url(#glowGradM)" />
      <circle class="nucleo" cx="645" cy="1145" r="85" fill="url(#coreGradM)" />
      <path class="linha l1" d="M645 1145 C 600 1000, 560 850, 620 640" />
      <path class="linha l2" d="M645 1145 C 720 1000, 760 820, 700 600" />
      <path class="linha l3" d="M645 1145 C 500 1200, 400 1300, 320 1420" />
      <path class="linha l4" d="M645 1145 C 780 1250, 830 1380, 870 1500" />
      <path class="linha l5" d="M645 1145 C 600 1290, 560 1380, 560 1540" />
      <circle class="no no--1" cx="620" cy="640" r="5" />
      <circle class="no no--2" cx="700" cy="600" r="5" />
      <circle class="no no--3" cx="320" cy="1420" r="5" />
      <circle class="no no--4" cx="870" cy="1500" r="5" />
      <circle class="no no--5" cx="560" cy="1540" r="4" />
      <circle class="no no--6" cx="640" cy="940" r="3" />
      <circle class="particula p--1" cx="180" cy="520" r="1.5" />
      <circle class="particula p--2" cx="760" cy="480" r="1.3" />
      <circle class="particula p--3" cx="300" cy="780" r="1.2" />
      <circle class="particula p--4" cx="700" cy="1640" r="1.4" />
      <circle class="particula p--5" cx="880" cy="960" r="1.3" />
      <circle class="particula p--6" cx="120" cy="900" r="1.1" />
    </svg>

    <div class="veil"></div>
  </div>

  <!-- Conteudo e acesso -->
  <main class="wrap">
    <section class="card" aria-label="Acesso ao BTC Radar">
      <div class="logo">₿</div>
      <h1>BTC Radar</h1>
      <p class="sub" id="subtitle">Entre com seu email e senha para acessar o painel.</p>
      <div class="tabs" role="tablist" aria-label="Modo de acesso">
        <button type="button" class="tab active" id="tab-login">Entrar</button>
        <button type="button" class="tab" id="tab-register">Criar conta</button>
      </div>
      <form id="gate-form" novalidate>
        <div class="field hidden" id="field-name">
          <label for="name">Nome</label>
          <input id="name" type="text" autocomplete="name" placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="voce@empresa.com" autofocus />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button id="submit" type="submit">Entrar no painel</button>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="foot">On-chain, sinais e sentimento do Bitcoin em tempo real.</p>
    </section>
  </main>

  <script src="/assets/auth.js" defer></script>
</body>
</html>
